# ============================================
# Prometheus Configuration
# ============================================
# 
# Prometheus scrapes (pulls) metrics from targets at regular intervals.
# Our Spring Boot app exposes metrics at /actuator/prometheus

global:
  scrape_interval: 15s      # How often to scrape targets
  evaluation_interval: 15s  # How often to evaluate rules

scrape_configs:
  # Prometheus scrapes itself for its own metrics
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # TaskForge application metrics
  - job_name: 'taskforge'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # host.docker.internal allows Docker container to reach host machine
      - targets: ['host.docker.internal:8080']
    # Relabel configs add extra labels to metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'taskforge-api'
