# ============================================
# TaskForge Application Configuration
# ============================================
# 
# This is YAML format - indentation matters! Use spaces, not tabs.
# Spring Boot reads this file automatically from src/main/resources/
#
# Configuration can come from multiple sources (in order of precedence):
# 1. Command line args: --server.port=9090
# 2. Environment variables: SERVER_PORT=9090
# 3. application-{profile}.yml (e.g., application-dev.yml)
# 4. application.yml (this file)
#
# Use ${ENV_VAR:default} syntax for environment variables with defaults

spring:
  application:
    name: taskforge
    
  # ========== PROFILES ==========
  # Profiles allow different configs for different environments
  # Active profile can be set via:
  #   - spring.profiles.active property
  #   - SPRING_PROFILES_ACTIVE env var
  #   - --spring.profiles.active=dev command line arg
  profiles:
    active: dev  # Default to dev profile
    
  # ========== DATABASE (PostgreSQL) ==========
  # JPA entities (User, Task, Project) go here
  datasource:
    # HOW THE BE CONNECTS TO POSTGRES:
    # 1. Docker maps Mac's port 5432 → PostgreSQL inside the container (docker-compose.yml: ports: "5432:5432")
    # 2. This URL tells the BE to connect to localhost:5432
    # 3. The BE doesn't know Docker is involved — it just sees localhost:5432 like any TCP connection
    # In production, DB_HOST would be your RDS endpoint (e.g. mydb.abc123.us-east-1.rds.amazonaws.com)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskforge}
    username: ${DB_USER:taskforge}     # matches POSTGRES_USER in docker-compose.yml
    password: ${DB_PASSWORD:taskforge} # matches POSTGRES_PASSWORD in docker-compose.yml
    # HikariCP connection pool settings
    hikari:
      pool-name: TaskForge-HikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000         # 30 seconds
      connection-timeout: 20000   # 20 seconds
      max-lifetime: 1800000       # 30 minutes
      
  # ========== JPA / HIBERNATE ==========
  jpa:
    # Hibernate settings
    hibernate:
      ddl-auto: validate  # validate = check schema matches entities (safest for prod)
                          # create = drop and create tables (dangerous!)
                          # update = try to update schema (risky)
                          # none = do nothing
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true  # Pretty print SQL in logs
        # Show SQL statistics (helpful for N+1 detection)
        generate_statistics: false
    # Show SQL queries in logs (disable in production!)
    show-sql: false
    open-in-view: false  # Disable OSIV anti-pattern
    
  # ========== FLYWAY (Database Migrations) ==========
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true  # Create baseline for existing databases
    
  # ========== MONGODB ==========
  # Activity logs and notifications go here (polyglot persistence)
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:taskforge}
      # For authenticated MongoDB:
      # uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:27017/${MONGO_DB}
      
    # ========== REDIS ==========
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD:}  # Uncomment if Redis has auth
      
  # ========== KAFKA ==========
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: taskforge-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.taskforge.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      
  # ========== RABBITMQ ==========
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    
  # ========== MAIL (Email) ==========
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}  # MailHog default port for dev
    # For real SMTP:
    # username: ${MAIL_USER}
    # password: ${MAIL_PASSWORD}
    # properties:
    #   mail.smtp.auth: true
    #   mail.smtp.starttls.enable: true

# ========== SERVER SETTINGS ==========
server:
  # WHERE THE BE PORT IS DEFINED — this is the only place.
  # No SERVER_PORT env var set → falls back to 8080
  # The JVM process listens on Mac's localhost:8080
  # curl http://localhost:8080/api/v1/tasks  ← hits this port directly (no Docker involved)
  port: ${SERVER_PORT:8080}
  # Graceful shutdown - wait for requests to complete
  shutdown: graceful
  # Compression for responses
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

# ========== ACTUATOR (Monitoring) ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized  # Show details only to authenticated users
      probes:
        enabled: true  # Enable /actuator/health/liveness and /readiness
  # Prometheus metrics
  prometheus:
    metrics:
      export:
        enabled: true

# ========== LOGGING ==========
logging:
  level:
    root: INFO
    com.taskforge: DEBUG  # Our code gets DEBUG level
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG  # See SQL queries
    org.hibernate.type.descriptor.sql: TRACE  # See SQL parameters (verbose!)
  pattern:
    # Structured logging pattern with correlation ID
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

# ========== API DOCUMENTATION ==========
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    
# ========== CUSTOM PROPERTIES ==========
# These are our own properties, accessed via @ConfigurationProperties
taskforge:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only-change-in-prod}
    expiration: 86400000  # 24 hours in milliseconds
    refresh-expiration: 604800000  # 7 days
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  features:
    notifications-enabled: true
    kafka-enabled: true
    rabbitmq-enabled: true
