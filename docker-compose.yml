# ============================================
# TaskForge Development Infrastructure
# ============================================
#
# This Docker Compose file spins up all the infrastructure TaskForge needs.
# 
# Usage:
#   Start all:    docker compose up -d
#   Stop all:     docker compose down
#   View logs:    docker compose logs -f [service-name]
#   Remove data:  docker compose down -v  (WARNING: deletes all data!)
#
# Services will be available at:
#   PostgreSQL:  localhost:5432
#   MongoDB:     localhost:27017
#   Redis:       localhost:6379
#   Kafka:       localhost:9092
#   RabbitMQ:    localhost:5672 (AMQP), localhost:15672 (Management UI)
#   MailHog:     localhost:1025 (SMTP), localhost:8025 (Web UI)
#   Prometheus:  localhost:9090
#   Grafana:     localhost:3000

services:
  # ========== DATABASES ==========
  
  postgres:
    image: postgres:16-alpine
    container_name: taskforge-postgres
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskforge-network

  mongodb:
    image: mongo:7
    container_name: taskforge-mongodb
    environment:
      MONGO_INITDB_DATABASE: taskforge
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskforge-network

  redis:
    image: redis:7-alpine
    container_name: taskforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskforge-network

  # ========== MESSAGE BROKERS ==========
  
  # Kafka requires Zookeeper (or KRaft mode in newer versions)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: taskforge-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - taskforge-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: taskforge-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9997:9997"  # JMX for monitoring
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JMX_PORT: 9997
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - taskforge-network

  # Kafka UI - web interface for Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: taskforge-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: taskforge
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - taskforge-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: taskforge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - taskforge-network

  # ========== EMAIL (Development) ==========
  
  # MailHog catches all outgoing emails - great for development
  mailhog:
    image: mailhog/mailhog:latest
    container_name: taskforge-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI - view caught emails here
    networks:
      - taskforge-network

  # ========== OBSERVABILITY ==========
  
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: taskforge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - taskforge-network

  grafana:
    image: grafana/grafana:10.4.1
    container_name: taskforge-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - taskforge-network

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: taskforge-jaeger
    ports:
      - "5775:5775/udp"   # Agent zipkin.thrift
      - "6831:6831/udp"   # Agent jaeger.thrift
      - "6832:6832/udp"   # Agent jaeger.thrift binary
      - "5778:5778"       # Agent configs
      - "16686:16686"     # Web UI
      - "14250:14250"     # gRPC
      - "14268:14268"     # HTTP collector
      - "14269:14269"     # Admin
      - "4317:4317"       # OTLP gRPC
      - "4318:4318"       # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: true
    networks:
      - taskforge-network

# ========== VOLUMES ==========
# Named volumes persist data between container restarts

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

# ========== NETWORKS ==========
# Custom network allows containers to communicate by name

networks:
  taskforge-network:
    driver: bridge
